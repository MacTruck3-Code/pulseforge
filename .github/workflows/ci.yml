name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-validation:
    name: Python validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python3 -m pip install --editable ".[dev]"

      - name: Run unit tests
        run: python3 -m pytest

      - name: Check formatting
        run: python3 -m ruff format --check .

      - name: Run linting
        run: python3 -m ruff check .

  container-validation:
    name: Container validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build --tag pulseforge:ci .

      - name: Validate container behavior
        run: |
          output="$(docker run --rm pulseforge:ci 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "PulseForge status: operational" <<< "$output"

      - name: Validate non-root user
        run: |
          user_id="$(docker run --rm --entrypoint id pulseforge:ci -u)"
          printf 'Container UID: %s\n' "$user_id"
          test "$user_id" -ne 0

      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "pulseforge:ci"
          format: "table"
          scanners: "vuln"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          cache: "true"

  kubernetes-validation:
    name: Kubernetes validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install kind
        run: |
          curl --fail --location --show-error --silent \
            --output kind-linux-amd64 \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64

          curl --fail --location --show-error --silent \
            --output kind-linux-amd64.sha256sum \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64.sha256sum

          sha256sum --check kind-linux-amd64.sha256sum

          chmod +x kind-linux-amd64
          sudo mv kind-linux-amd64 /usr/local/bin/kind

          kind version

      - name: Install kubectl
        run: |
          curl --fail --location --show-error --silent \
            --output kubectl \
            https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl

          curl --fail --location --show-error --silent \
            --output kubectl.sha256 \
            https://dl.k8s.io/release/v1.36.3/bin/linux/amd64/kubectl.sha256

          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check

          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl

          kubectl version --client

      - name: Install Helm
        run: |
          curl --fail --location --show-error --silent \
            --output helm.tar.gz \
            https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz

          curl --fail --location --show-error --silent \
            --output helm.tar.gz.sha256sum \
            https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz.sha256sum

          sha256sum --check helm.tar.gz.sha256sum

          tar --extract --gzip --file helm.tar.gz

          sudo install \
            -o root \
            -g root \
            -m 0755 \
            linux-amd64/helm \
            /usr/local/bin/helm

          helm version --short

      - name: Validate Helm chart
        run: |
          helm lint charts/pulseforge

          helm template pulseforge charts/pulseforge \
            --namespace pulseforge \
            > /tmp/pulseforge-rendered.yaml

          test -s /tmp/pulseforge-rendered.yaml

      - name: Create kind cluster
        run: |
          kind create cluster \
            --name pulseforge-ci \
            --wait 60s

      - name: Build container image
        run: docker build --tag pulseforge:0.1.0 .

      - name: Load image into kind
        run: |
          kind load docker-image pulseforge:0.1.0 \
            --name pulseforge-ci

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/job.yml

      - name: Validate Deployment rollout
        run: |
          kubectl rollout status deployment/pulseforge \
            --namespace pulseforge \
            --timeout 60s

      - name: Validate Job completion
        run: |
          kubectl wait \
            --for=condition=complete \
            job/pulseforge \
            --namespace pulseforge \
            --timeout 60s

      - name: Validate Service access
        run: |
          kubectl port-forward \
            service/pulseforge \
            --namespace pulseforge \
            18080:8080 \
            > /tmp/pulseforge-port-forward.log 2>&1 &

          port_forward_pid=$!
          trap 'kill "$port_forward_pid"' EXIT

          for attempt in {1..10}; do
            if curl --fail --silent \
              http://127.0.0.1:18080/health/ready \
              | grep -Fq '{"status":"ready"}'; then
              exit 0
            fi

            sleep 1
          done

          cat /tmp/pulseforge-port-forward.log
          exit 1

      - name: Collect Kubernetes diagnostics
        if: failure()
        run: |
          helm status pulseforge \
            --namespace pulseforge || true

          helm get values pulseforge \
            --namespace pulseforge \
            --all || true

          helm get manifest pulseforge \
            --namespace pulseforge || true

          kubectl get all --namespace pulseforge || true

          kubectl get events \
            --namespace pulseforge \
            --sort-by='.lastTimestamp' || true
          
          kubectl describe deployment pulseforge \
            --namespace pulseforge || true
          
          kubectl describe job pulseforge \
            --namespace pulseforge || true
          
          kubectl logs deployment/pulseforge \
            --namespace pulseforge || true
          
          kubectl logs job/pulseforge \
            --namespace pulseforge || true
