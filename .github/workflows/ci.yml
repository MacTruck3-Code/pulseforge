name: Continuous Integration

on:
  push:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: python3 -m pip install --editable ".[dev]"

      - name: Run unit tests
        run: python3 -m pytest
      
      - name: Check formatting
        run: python3 -m ruff format --check .

      - name: Run linting
        run: python3 -m ruff check .
  container-validation:
    name: Container validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag pulseforge:ci .

      - name: Validate container behavior
        run: |
          output="$(docker run --rm pulseforge:ci 2>&1)"
          printf '%s\n' "$output"
          grep -Fq "PulseForge status: operational" <<< "$output"

      - name: Validate non-root user
        run: |
          user_id="$(docker run --rm --entrypoint id pulseforge:ci -u)"
          printf 'Container UID: %s\n' "$user_id"
          test "$user_id" -ne 0

      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "pulseforge:ci"
          format: "table"
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
          cache: "false"