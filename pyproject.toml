[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseforge"
version = "0.1.0"
description = "A production-oriented platform engineering learning application."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Clarence McIntyre III" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.15.22,<0.16",
]

[project.scripts]
pulseforge = "pulseforge.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest]
minversion = "9.1"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = [
    "I",
]
