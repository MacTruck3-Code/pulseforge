apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulseforge
  namespace: pulseforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulseforge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulseforge
    spec:
      containers:
        - name: pulseforge
          image: pulseforge:phase6
          imagePullPolicy: IfNotPresent
          args:
            - serve
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5